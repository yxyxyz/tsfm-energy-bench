[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bdg2-tsfm"
version = "0.1.0"
description = "Reproducible zero-shot TSFM evaluation on the BDG2 Fox site"
requires-python = ">=3.10,<3.13"
dependencies = [
  "holidays>=0.87,<1",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
]

[project.optional-dependencies]
energy = ["codecarbon==3.2.9", "carbontracker==2.4.5"]
plotting = ["matplotlib>=3.8,<4"]

[project.scripts]
bdg2-tsfm = "bdg2_tsfm.main:main"

[tool.setuptools.packages.find]
where = ["src"]

